name: Docker dry run

# Proves the image still builds and actually runs, without pushing anything and
# without any Docker Hub credentials. Runs for pull requests and on demand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Build, start, and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: quorum:dry-run
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start the container and smoke-test it
        run: scripts/docker-smoke.sh "$IMAGE"

      - name: Validate the compose files
        env:
          QUORUM_PASSWORD: dry-run
        run: |
          docker compose config --quiet
          QUORUM_DOMAIN=quorum.example.com docker compose --profile caddy config --quiet

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Built as a dry run (nothing was pushed)"
            echo "Image: $IMAGE, platform linux/amd64, smoke test: see the step above."
          } >> "$GITHUB_STEP_SUMMARY"
